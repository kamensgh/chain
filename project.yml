name: Chain
options:
  bundleIdPrefix: com.chain
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: none

targets:
  Chain:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Chain
    info:
      path: Chain/Info.plist
      properties:
        CFBundleDisplayName: Chain
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
    settings:
      base:
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  ChainTests_iOS_Runner:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChainTests
    dependencies:
      - target: Chain_iOS
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

  ChainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ChainTests
    dependencies:
      - target: Chain_macOS
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chain.app/Contents/MacOS/Chain"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Chain_macOS:
    build:
      targets:
        Chain_macOS: all
        ChainTests: [test]
    test:
      targets:
        - ChainTests
