name: Chain
options:
  bundleIdPrefix: com.chain
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: none

targets:
  Chain:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Chain
    info:
      path: Chain/Info.plist
      properties:
        CFBundleDisplayName: Chain
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
    settings:
      base:
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  ChainTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - path: ChainTests
    dependencies:
      - target: Chain_iOS
        platformFilter: ios
      - target: Chain_macOS
        platformFilter: macos
    settings:
      base:
        SWIFT_VERSION: "5.9"
