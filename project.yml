name: Chain
options:
  bundleIdPrefix: com.chain
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  groupSortPosition: none

targets:
  Chain:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Chain
    dependencies:
      - target: ChainWidget
        embed: true
        platforms: [iOS]
      - target: ChainWatch
        embed: true
        platforms: [watchOS]
      - sdk: WatchConnectivity.framework
        platforms: [iOS]
    info:
      path: Chain/Info.plist
      properties:
        CFBundleDisplayName: Chain
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSHealthShareUsageDescription: "Chain reads health data to automatically verify your fitness habits."
        NSPhotoLibraryUsageDescription: "Chain saves a screenshot as proof that you completed your habit."
        NSCameraUsageDescription: "Chain lets you take a photo as proof that you completed your habit."
    settings:
      base:
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Chain/Chain.entitlements

  ChainWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ChainWidget
      - path: Chain/Models
      - path: Chain/Domain
      - path: Chain/Persistence
    settings:
      base:
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: ChainWidget/ChainWidget.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.chain.Chain.widget
    info:
      path: ChainWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ChainWatch:
    type: application
    platform: watchOS
    sources:
      - path: ChainWatch
      - path: Chain/Models
      - path: Chain/Domain
    dependencies:
      - target: ChainWatchWidget
        embed: true
      - sdk: WatchConnectivity.framework
    info:
      path: ChainWatch/Info.plist
      properties:
        CFBundleDisplayName: Chain
        WKApplication: YES
        WKCompanionAppBundleIdentifier: com.chain.Chain
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.chain.Chain.watch

  ChainWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: ChainWatchWidget
      - path: Chain/Models
      - path: Chain/Domain
    info:
      path: ChainWatchWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: com.chain.Chain.watch.widget

  ChainTests_iOS_Runner:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChainTests
    dependencies:
      - target: Chain_iOS
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO

  ChainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ChainTests
    dependencies:
      - target: Chain_macOS
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chain.app/Contents/MacOS/Chain"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Chain_macOS:
    build:
      targets:
        Chain_macOS: all
        ChainTests: [test]
    test:
      targets:
        - ChainTests
